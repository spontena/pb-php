name: CI

on:
  push:
    branches: [master, v2, 'security/**']
  pull_request:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
        guzzle: ['^7.16', '^8.0']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-guzzle${{ matrix.guzzle }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-guzzle${{ matrix.guzzle }}-

      # composer.lock is not committed, so pin the Guzzle major for this job;
      # otherwise every job would resolve to the newest major.
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --with "guzzlehttp/guzzle:${{ matrix.guzzle }}"

      - name: Audit dependencies
        run: composer audit --locked

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --level=6 --no-progress
